services:
  backend:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://localhost
    restart: unless-stopped

  frontend:
    build:
      args:
        REACT_APP_API_URL: https://localhost
        VITE_API_URL: https://localhost
    environment:
      REACT_APP_API_URL: https://localhost
    restart: unless-stopped

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped